<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b14">
  <meta name="robots" content="noindex,follow">
  <meta name="description" content="The page you're looking for could not be found. Return to Jay Prakash Sonkar's portfolio.">
  <title>Page not found — Jay Prakash Sonkar</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/portfolio-v2.css">
  <style>
    .not-found { min-height: 100svh; display: grid; place-items: center; padding-block: 120px 64px; text-align: center; }
    .not-found-inner { max-width: 680px; }
    .not-found-code { color: var(--cyan); font: 500 clamp(5rem, 18vw, 10rem)/.9 "DM Mono", monospace; letter-spacing: -.09em; }
    .not-found h1 { margin: 24px auto 18px; font-size: clamp(2.4rem, 6vw, 4.5rem); }
    .not-found p { color: var(--muted); font-size: 1.1rem; }
    .not-found .hero-actions { justify-content: center; margin-top: 30px; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <main id="main" class="shell not-found">
    <div class="not-found-inner">
      <p class="eyebrow"><span class="status-dot"></span> Route not found</p>
      <div class="not-found-code" aria-hidden="true">404</div>
      <h1>This page took a <em>different route.</em></h1>
      <p>The address may be outdated, or the page may have moved. The useful work is still here.</p>
      <div class="hero-actions">
        <a class="button button-primary" href="./">Go to homepage <span aria-hidden="true">↗</span></a>
        <a class="button button-secondary" href="projects.html">Explore case studies <span aria-hidden="true">↗</span></a>
      </div>
    </div>
  </main>
</body>
</html>
